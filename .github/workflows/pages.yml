name: Publicar no GitHub Pages

on:
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - name: Preparar arquivos do site
        env:
          STATEMENT_ENDPOINT: ${{ vars.STATEMENT_ENDPOINT }}
        run: |
          mkdir _site
          cp index.html styles.css app.css statement.css login.js expenses.js expense-sync.js statement.js advisor.js statement-config.js _site/
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          let statement = '';
          let expenses = '';
          if (process.env.STATEMENT_ENDPOINT) {
            const url = new URL(process.env.STATEMENT_ENDPOINT);
            if (url.protocol !== 'https:' || url.username || url.password || url.pathname !== '/api/statement' || url.search || url.hash) {
              throw new Error('STATEMENT_ENDPOINT deve conter a URL HTTPS do Worker seguida de /api/statement.');
            }
            statement = url.href;
            expenses = new URL('/api/expenses', url).href;
          }
          writeFileSync('_site/statement-config.js',
            'const statementEndpoint = ' + JSON.stringify(statement) + ';\n' +
            'const expensesEndpoint = ' + JSON.stringify(expenses) + ';\n');
          NODE
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
